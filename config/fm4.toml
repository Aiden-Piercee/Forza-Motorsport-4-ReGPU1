# XenonRecomp config for Forza Motorsport 4 (4D530910), Europe Game of the Year
# default.xex, sha256 b34dfb88978819cccda6dafd755e7139970a58fbf6707dfbcba06846857f52bd.
# Paths are relative to this file. See docs/FM4-RECOMPILE.md.
[main]
file_path = "../game/default.xex"
out_directory_path = "../out/ppc"
switch_table_file_path = "fm4_switch_tables.toml"

# Registers kept in host locals instead of the guest context (faster), as in FM2.
# Hooks and the diagnostics read the GPRs and LR from the context, so those stay.
skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers. tools/fm4_config.py --write fills these in from
# the xexdump image (0x0: not present in this image).
restgprlr_14_address = 0x82766060
savegprlr_14_address = 0x82766010
restfpr_14_address = 0x8276682C
savefpr_14_address = 0x827667E0
restvmx_14_address = 0x82765518
savevmx_14_address = 0x82765280
restvmx_64_address = 0x827655AC
savevmx_64_address = 0x82765314

# CRT setjmp/longjmp: mapped to host setjmp/longjmp with the guest context saved
# and restored around them. Found from tools/fm4_config.py's candidates and
# confirmed in the disassembly: setjmp saves f14-f31, r13-r31, v64+, CR at +304,
# LR at +308 and r1 at +144, and returns 0. longjmp restores the same layout,
# turns 0 into 1, and unwinds first when +312 is set. fm4_config.py's own two
# candidates are not entry points: 0x82768B98 is inside setjmp and 0x82C85588
# inside SwitchToFiber.
setjmp_address = 0x82768B30
longjmp_address = 0x82768700

# Functions XenonRecomp's .pdata/branch analysis gets wrong, each with the reason
# and the check that found it (tools/fallthrough.py, tools/fm4_crosscheck.py, a
# runtime trace). Empty until the first recompile has been checked.
functions = [
    # SwitchToFiber. .pdata folds it into 0x82C85370 (the new-fiber start thunk
    # CreateFiber puts in LR), and callers reach it through the stub at
    # 0x82C82C10 (b 0x82C85380). The fiber hooks replace it, so it needs its
    # own entry; its last instruction is the b at 0x82C85788.
    { address = 0x82C85380, size = 0x40C },
]

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    # Exception data (handler + scope table) placed before functions with
    # ExceptionFlag set in .pdata.
    # BEGIN fm4_config.py exception data
    { data = 0x82C93530, size = 8 }, # handler of 298 functions
    { data = 0x82D4B274, size = 8 }, # handler of 54 functions
    { data = 0x82C9A480, size = 8 }, # handler of 1 functions
    # END fm4_config.py exception data
]
